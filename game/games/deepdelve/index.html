<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deepdelve</title>
<link rel="stylesheet" href="deepdelve.css">
</head>
<body>
<header class="bar">
  <a class="btn back" href="../../hub/index.html" id="back-hub">Hub</a>
  <a class="btn back" href="../../index.html" id="back-town">Town</a>
  <h1>Deepdelve</h1>
  <button class="btn" id="craft-btn" type="button" disabled>Torch</button>
</header>
<nav class="bar tools" aria-label="Tools">
  <button class="btn" id="open-craft" type="button" aria-controls="craft-panel">Craft (C)</button>
  <button class="btn" id="open-goals" type="button" aria-controls="goals-panel">Goals (G)</button>
  <button class="btn" id="mode-btn" type="button" aria-label="Toggle creative mode (M)">Mode: Survival</button>
</nav>
<main id="stage">
  <canvas id="gl" aria-label="Deepdelve world"></canvas>
  <div id="cross" aria-hidden="true"></div>
  <div id="hud" aria-live="polite">
    <span id="hud-hp"></span> <span id="hud-depth"></span> <span id="hud-seed"></span>
    <div id="hpbar" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10"><div id="hpfill"></div></div>
    <div id="hud-pick"></div>
    <div id="hud-goal"></div>
  </div>
  <p id="msg" role="status" aria-live="polite">Loading the mine...</p>
  <section id="craft-panel" class="panel" role="dialog" aria-label="Crafting" hidden>
    <div class="ph"><h2>Crafting</h2><button class="btn mini" id="close-craft" type="button">Close</button></div>
    <p id="ingots" class="note"></p>
    <div class="smelt"><button class="btn mini" id="craft-filter" type="button" aria-pressed="false">Showing: all</button><span id="bench-note" class="note"></span></div>
    <div class="smelt"><button class="btn mini" id="smelt-iron" type="button">Smelt iron</button><button class="btn mini" id="smelt-gold" type="button">Smelt gold</button><span id="furnace-note" class="note"></span></div>
    <ul id="recipes"></ul>
  </section>
  <section id="goals-panel" class="panel" role="dialog" aria-label="Goals and medals" hidden>
    <div class="ph"><h2>Goals</h2><button class="btn mini" id="close-goals" type="button">Close</button></div>
    <ul id="goal-list"></ul>
    <p id="goal-stats" class="note"></p>
  </section>
  <div id="touch" hidden>
    <div id="joy" aria-label="Move"><div id="knob"></div></div>
    <div id="tbtns">
      <button class="btn tb" id="t-jump" type="button">Jump</button>
      <button class="btn tb" id="t-down" type="button" hidden>Down</button>
      <button class="btn tb" id="t-mine" type="button">Mine</button>
      <button class="btn tb" id="t-place" type="button">Place</button>
    </div>
  </div>
</main>
<nav id="hotbar" aria-label="Hotbar"></nav>
<script src="../../shared/rng.js"></script>
<script src="../../shared/mm-chunks.js"></script>
<script src="../../shared/mm-light.js"></script>
<script src="../../shared/mm-recipes.js"></script>
<script src="../../shared/mm-dd-craft.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="deepdelve.js"></script>
</body>
</html>
