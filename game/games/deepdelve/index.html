<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deepdelve</title>
<link rel="stylesheet" href="../../shared/mm-8bit.css">
<link rel="stylesheet" href="deepdelve.css">
<script src="../../shared/mm-8bit.js"></script>
<script src="../../shared/mm-access.js"></script>
<script src="../../shared/mm-side-access.js"></script>
<link rel="stylesheet" href="../../shared/mm-nav.css">
<link rel="stylesheet" href="../../shared/mm-settings.css">
</head>
<body>
<header class="bar">
  <a class="btn back" href="../../hub/index.html" id="back-hub">Hub</a>
  <a class="btn back" href="../../index.html" id="back-town">Town</a>
  <h1>Deepdelve</h1>
  <button class="btn" id="craft-btn" type="button" disabled>Torch</button>
</header>
<nav class="bar tools" aria-label="Tools">
  <button class="btn" id="open-craft" type="button" aria-controls="craft-panel">Craft (C)</button>
  <button class="btn" id="open-goals" type="button" aria-controls="goals-panel">Goals (G)</button>
  <button class="btn" id="mode-btn" type="button" aria-label="Toggle creative mode (M)">Mode: Survival</button>
  <button class="btn" id="world-btn" type="button" aria-label="Open the calm creative world (separate save)">Creative world</button>
</nav>
<main id="stage">
  <canvas id="gl" aria-label="Deepdelve world"></canvas>
  <div id="cross" aria-hidden="true"></div>
  <div id="minebar" aria-hidden="true" hidden><div id="mineprog"></div></div>
  <div id="hud" aria-live="polite">
    <span id="hud-hp"></span> <span id="hud-depth"></span> <span id="hud-time"></span> <span id="hud-seed"></span>
    <div id="hpbar" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10"><div id="hpfill"></div></div>
    <div id="hud-pick"></div>
    <div id="hud-goal"></div>
    <div id="creative-note" hidden></div>
    <div id="hud-dive"></div>
  </div>
  <div id="combo" aria-hidden="true"></div>
  <div id="pops" aria-hidden="true"></div>
  <p id="msg" role="status" aria-live="polite">Loading the mine...</p>
  <section id="craft-panel" class="panel" role="dialog" aria-label="Crafting" hidden>
    <div class="ph"><h2>Crafting</h2><button class="btn mini" id="close-craft" type="button">Close</button></div>
    <p id="ingots" class="note"></p>
    <div class="smelt"><button class="btn mini" id="craft-filter" type="button" aria-pressed="false">Showing: all</button><span id="bench-note" class="note"></span></div>
    <div class="smelt"><button class="btn mini" id="smelt-iron" type="button">Smelt iron</button><button class="btn mini" id="smelt-gold" type="button">Smelt gold</button><span id="furnace-note" class="note"></span></div>
    <ul id="recipes"></ul>
    <h3 class="sub">Grotto and blueprint crafts</h3>
    <ul id="recipes-x"></ul>
  </section>
  <section id="goals-panel" class="panel" role="dialog" aria-label="Goals and medals" hidden>
    <div class="ph"><h2>Goals</h2><button class="btn mini" id="close-goals" type="button">Close</button></div>
    <ul id="goal-list"></ul>
    <h3 class="sub">More goals</h3>
    <ul id="goal-more"></ul>
    <h3 class="sub">Blueprints</h3>
    <ul id="goal-build"></ul>
    <p id="build-stats" class="note"></p>
    <p id="goal-stats" class="note"></p>
  </section>
  <section id="run-panel" class="panel" role="dialog" aria-label="Dive summary" hidden>
    <div class="ph"><h2 id="run-title">Dive over</h2><button class="btn mini" id="close-run" type="button">Close</button></div>
    <p id="run-why" class="note"></p>
    <p id="run-score"></p>
    <ul id="run-stats"></ul>
    <p id="run-tip" class="note"></p>
    <p id="run-next" class="note"></p>
    <button class="btn big" id="run-again" type="button">Dive again</button>
  </section>
  <div id="touch" hidden>
    <div id="joy" aria-label="Move"><div id="knob"></div></div>
    <div id="tbtns">
      <button class="btn tb" id="t-jump" type="button">Jump</button>
      <button class="btn tb" id="t-down" type="button" hidden>Down</button>
      <button class="btn tb" id="t-mine" type="button">Mine</button>
      <button class="btn tb" id="t-place" type="button">Place</button>
    </div>
  </div>
</main>
<nav id="hotbar" aria-label="Hotbar"></nav>
<script src="../../shared/rng.js"></script>
<script src="../../shared/mm-chip.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="../../shared/mm-input.js"></script>
<script src="dd-run.js"></script>
<script src="../../shared/mm-chunks.js"></script>
<script src="../../shared/mm-light.js"></script>
<script src="../../shared/mm-recipes.js"></script>
<script src="../../shared/mm-dd-craft.js"></script>
<script src="../../shared/mm-dd-time.js"></script>
<script src="../../shared/mm-dd-mobs.js"></script>
<script src="../../shared/mm-dd-spawn.js"></script>
<script src="../../shared/mm-dd-grotto.js"></script>
<script src="../../shared/mm-dd-build.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="../../shared/mm-nav.js" data-mount="manual"></script>
<script>
(function () {
  if (!window.MMNav) return;
  MMNav.mount({ page: 'deepdelve', legacy: '#back-hub,#back-town', avoid: '.bar h1', backHref: '../../hub/index.html', backLabel: 'World map' });
  // the old links are clipped to 1 px while the Menu button is on: keep them in the DOM (and for screen readers) but out of the Tab order
  if (document.body.classList.contains('mm-nav-on')) ['back-hub', 'back-town'].forEach(function (id) { var e = document.getElementById(id); if (e) e.setAttribute('tabindex', '-1'); });
  var cover = [], shut = ['craft-panel','goals-panel','run-panel'];
  function open(ids) { return ids.some(function (id) { var e = document.getElementById(id); return e && !e.hidden; }); }
  function sync() { MMNav.setCovered(open(cover)); if (open(cover) || open(shut)) MMNav.close(); }
  var mo = window.MutationObserver ? new MutationObserver(sync) : null;
  cover.concat(shut).forEach(function (id) { var e = document.getElementById(id); if (e && mo) mo.observe(e, { attributes: true, attributeFilter: ['hidden'] }); });
}());
</script>
<script src="../../shared/mm-settings.js"></script>
<script>
(function () {
  // Settings (text size, reduce motion, low graphics, sound) from the Menu sheet; deepdelve.js listens for mm-settings-change.
  try { var S = window.MMSettings && MMSettings.mount({ page: 'deepdelve' }); if (S && window.MMNav && MMNav.onSettings) MMNav.onSettings(function () { S.open(); }); } catch (e) { /* settings are optional */ }
}());
</script>
<script src="../../shared/profile.js"></script>
<script src="deepdelve.js"></script>
</body>
</html>
