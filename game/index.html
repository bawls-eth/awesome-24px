<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Pixeltown</title>
<link rel="stylesheet" href="style.css" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c2430" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

<!-- iOS "Add to Home Screen": apple-touch-icon is what shows as the app icon;
     the two meta tags make it launch full-screen (no Safari chrome) instead
     of just bookmarking the page. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pixeltown" />
</head>
<body>

<div id="join-overlay">
  <div class="join-card">
    <h1>🏝️ Pixeltown</h1>
    <p class="tagline">Walk, chat, fish, chop wood, and build — with your friends, live.</p>

    <label for="name-input">Your name</label>
    <input id="name-input" maxlength="16" placeholder="e.g. Ben" autocomplete="off" />

    <label>Pick your villager</label>
    <div id="species-tabs"></div>
    <div id="avatar-grid"></div>

    <button id="join-btn" disabled>Join Town</button>
    <p id="join-error" class="error"></p>
    <p class="join-tip">WASD/arrows to walk · <b>E</b> to interact (fish, chop, mine) · <b>B</b> to build · <b>1-5</b> to emote · Enter to chat</p>
  </div>
</div>

<div id="game-container"></div>

<div id="hud" class="hidden">
  <div id="player-list-panel">
    <h2>In town</h2>
    <ul id="player-list"></ul>
  </div>

  <div id="inventory-panel">
    <span id="bag-icon">🎒</span>
    <span>🪵 <b id="wood-count">0</b></span>
    <span>🪨 <b id="stone-count">0</b></span>
    <span>🐟 <b id="fish-count">0</b></span>
  </div>

  <div id="chat-panel">
    <div id="chat-log"></div>
    <div id="chat-input-row">
      <input id="chat-input" maxlength="140" placeholder="Press Enter to chat…" enterkeyhint="send" autocomplete="off" />
      <button id="chat-send-btn" type="button" aria-label="Send">➤</button>
    </div>
  </div>

  <div id="mobile-controls">
    <div id="dpad">
      <button class="dpad-btn" data-dir="up" type="button" aria-label="Up">▲</button>
      <button class="dpad-btn" data-dir="left" type="button" aria-label="Left">◀</button>
      <button class="dpad-btn" data-dir="right" type="button" aria-label="Right">▶</button>
      <button class="dpad-btn" data-dir="down" type="button" aria-label="Down">▼</button>
    </div>

    <div id="emote-popup" class="hidden"></div>

    <div id="action-buttons">
      <button id="tilt-toggle-btn" type="button">🎮 Tilt</button>
      <button id="build-toggle-btn" type="button" aria-label="Build">🧱</button>
      <button id="interact-btn" type="button" aria-label="Interact">✋</button>
      <button id="emote-toggle-btn" type="button" aria-label="Emotes">😀</button>
      <button id="mobile-chat-btn" type="button" aria-label="Chat">💬</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="net.js"></script>
<script src="main.js"></script>
</body>
</html>
