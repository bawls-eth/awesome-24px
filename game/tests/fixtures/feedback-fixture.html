<!doctype html>
<html lang="en">
<head>

<title>MMFeedback fixture</title>
<style>
  html, body { margin: 0; background: #0d0f14; color: #eee; font: 15px system-ui, sans-serif; }
  main { padding: 16px; max-width: 520px; margin: 0 auto; }
  .settings { border: 1px solid #333; border-radius: 8px; padding: 8px 12px; }
</style>
</head>
<body>
<main>

<script>

  window.__fb = MMFeedback.mount(document.getElementById('settings-body'), { page: 'fixture' });
</script>
